<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike Archives</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="search-container">
        <div class="brand-header">
            <h1>Counter-Strike Archives</h1>
            <p>Index historique des matchs et POVs compétitifs (2013-2014)</p>
        </div>

        <div class="search-box-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="main-search" placeholder="Rechercher par joueur, équipe, map, tournoi..." autocomplete="off" spellcheck="false" autofocus>
            <button id="clear-search" class="hidden-btn" title="Effacer la recherche"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="quick-filters">
            <span class="filter-label">Filtres rapides :</span>
            <button class="filter-tag active" onclick="filterByQuickTag('all')">Tous</button>
            <button class="filter-tag" onclick="filterByQuickTag('2014')">2014</button>
            <button class="filter-tag" onclick="filterByQuickTag('EMS Katowice')">EMS Katowice</button>
            <button class="filter-tag" onclick="filterByQuickTag('POV')">POVs</button>
        </div>
    </div>

    <main class="archive-section">
        <div class="results-counter" id="results-count">Chargement des archives...</div>
        <div class="archive-grid" id="archive-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
