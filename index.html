<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jojos | Advanced Tactical Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Écran de démarrage / Faux chargement Cyberpunk -->
    <div id="loader-screen">
        <div class="loader-content">
            <div class="loader-terminal-text">INITIALIZING JOJOS_SYSTEM.EXE...</div>
            <div class="loader-bar-container">
                <div class="loader-bar-progress" id="load-progress"></div>
            </div>
            <div class="loader-percentage" id="load-percentage">0%</div>
        </div>
    </div>

    <!-- Effets d'ambiance de fond -->
    <div class="bg-grid"></div>
    <div class="scanlines"></div>
    <canvas id="digital-rain"></canvas>

    <div class="main-container" id="main-content">
        
        <!-- Panneau Central avec effet Tilt 3D -->
        <div class="central-panel js-tilt">
            <div class="profile-section">
                <!-- CORRECTION ICI : Une seule div wrapper pour l'avatar -->
                <div class="avatar-wrapper">
                    <img src="images/dark-profile-pictures-2560-x-1440-b11uavaq1vdn8p1c.jpg" alt="Steam Avatar" class="steam-avatar">
                </div>
                <h1 data-value="JOJOS" id="username">JOJOS</h1>
                <p class="tagline"><span class="pulse-dot"></span> SYSTEM ACTIVE // CONTENT CREATOR</p>
            </div>

            <!-- Liens principaux -->
            <div class="links-container">
                <a href="https://www.youtube.com/@jojos13450" target="_blank" class="link-btn btn-cs2">
                    <img src="images/game-icon.bmp" alt="CS2" class="game-icon">
                    <span class="btn-text">CS2 PRO POVs</span>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>

                <a href="https://www.youtube.com/@oldgameplay13450" target="_blank" class="link-btn btn-ut">
                    <img src="images/FLLcdTLXoAEnNn8.jpg" alt="UT" class="game-icon ut-logo-fix">
                    <span class="btn-text">Old Games Gameplay</span>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>

                <a href="steam://connect/IP_DE_TON_SERVEUR:PORT" class="link-btn btn-cs16">
                    <img src="images/dbe0g4p-dbb24ee6-04f3-4529-a872-e6ed6678cd4b.png" alt="CS 1.6" class="game-icon cs16-logo-fix">
                    <span class="btn-text">CS 1.6 SERVER</span>
                    <!-- Ajout de l'id et d'une classe par défaut CHECKING -->
                    <span id="server-status" class="status-badge checking">CHECKING...</span>
                </a>    
            </div>
        </div>

        <!-- Section "Latest Content" -->
        <h2 class="section-title"><i class="fa-solid fa-fire"></i> LATEST CONTENT</h2>
        <div class="cards-grid" id="content-grid"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
